# Throwaway Postgres for integration/e2e tests and the restore drill. Exposed on localhost only.
name: pinkas-test
services:
  db-test:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: pinkas_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30
