name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: pinkas_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: test }
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm vitest run --coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:55432/pinkas_test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/lcov.info, if-no-files-found: ignore }
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: echo "e2e lands with Phase 1 (Playwright against docker-compose.test.yml)"
